management.endpoints.web.exposure.include=metrics,prometheus,health
#spring.config.import=optional:aws-secretsmanager:test/secretmanager
#logging.level.io.awspring.cloud.secretsmanager= debug

#Swagger3 OpenAPI properties
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.datasource.url=jdbc:postgresql://candidate-tracker-db.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=candidatetrackeradmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000